name: Update stats cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=hsalnasi&show_icons=true&hide_border=true&bg_color=0a0d1c&title_color=4cc9f0&text_color=e8edff&icon_color=f72585
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=hsalnasi&layout=compact&hide_border=true&bg_color=0a0d1c&title_color=4cc9f0&text_color=e8edff
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update stats cards" || exit 0
          git push
